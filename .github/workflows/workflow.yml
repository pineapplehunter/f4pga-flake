name: CI

# Update the pinned action revisions with:
# nix run nixpkgs#bun -- x actions-up

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run all bitstream checks (downloads additional architecture data)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        system:
          - "aarch64-linux"
          - "x86_64-linux"

    runs-on: >-
      ${{ (matrix.system == 'x86_64-linux' && 'ubuntu-26.04')
      || (matrix.system == 'aarch64-linux' && 'ubuntu-26.04-arm') }}

    timeout-minutes: 720

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            fallback = true
            accept-flake-config = true
            max-jobs = 1
            system = ${{ matrix.system }}

      - uses: Mic92/niks3-action@12d3e320b2a99b7938f9634bd337cd9fec104609 # v1.1.0
        with:
          server-url: https://niks3.s.ihavenojob.work

      - name: Run CI checks (packaging and XC7A35T bitstream)
        run: nix flake check -L

      - name: Run full test suite
        if: github.event_name == 'workflow_dispatch' && inputs.full_tests
        run: nix build --no-link -L .#tests-full
